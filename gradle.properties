# Saaya Lite — build memory, sized for the founder's 8 GB machine.
#
# Set on 2026-08-19 after T1.1 exhausted Gradle's 512 MiB default during KSP.
# These are NOT the usual 2g/1g recommendation: that is sized for a 16 GB machine, and on
# 8 GB it risks swap thrashing, which makes builds slower and less reliable rather than more.
#
# KSP runs in the KOTLIN daemon, not the Gradle daemon, so both need raising. Setting only
# org.gradle.jvmargs is the common mistake and would not have fixed the failure.

org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# 8 cores but 8 GB. Capping workers holds peak memory down; parallelism is not the
# bottleneck on a machine this size.
org.gradle.workers.max=2
org.gradle.parallel=false

# Standard AndroidX + Kotlin flags
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# If a build still OOMs, in this order:
#   1. close Android Studio and any browser. Codex builds headless; nothing else needs the RAM.
#   2. ./gradlew --stop   to kill stale daemons holding heap
#   3. raise kotlin.daemon.jvmargs to 2048m FIRST (KSP is the pressure), not the Gradle heap
#   4. only then raise org.gradle.jvmargs
# Do not raise both to 2g on this machine. Report if step 3 is not enough.
